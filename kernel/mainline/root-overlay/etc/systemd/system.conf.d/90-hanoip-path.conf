[Manager]
# systemd 262 starts services with PATH=/usr/local/bin:/usr/bin. ip, modprobe and swapon are in /usr/sbin here (unmerged
# bin), so hanoip-modem, hanoip-usb-gadget and zram failed at boot. Give every service the sbin directories back.
DefaultEnvironment="PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
