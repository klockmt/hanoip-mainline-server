# wlan0 and eth0 sit on the same subnet. With the default arp_ignore=0, wlan0 answers the ARP probe NetworkManager sends for
# eth0's new address, NetworkManager reads that as another host holding it, eth0 gets no default route and Wi-Fi is never
# switched off (issue #41). 1 = an interface answers only for the addresses it holds itself.
net.ipv4.conf.all.arp_ignore = 1
