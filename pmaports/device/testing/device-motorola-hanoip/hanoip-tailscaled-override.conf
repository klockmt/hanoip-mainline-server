# tailscaled starts after nftables.service. nftables reloads /etc/nftables.nft, which begins with "flush ruleset", and
# a reload that runs after tailscaled wipes the chains Tailscale adds (ts-forward). Duranium is systemd, so this applies
# there; the 4.14 server is OpenRC and ignores it.
[Unit]
After=nftables.service
